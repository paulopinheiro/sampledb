<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SampleDB - Discount Codes</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-50 font-sans text-gray-800 p-6">

        <div class="max-w-4xl mx-auto">
            <!-- Breadcrumb & Back button -->
            <div class="mb-4">
                <a href="index.html" class="text-blue-600 hover:underline text-sm">← Back to Main Menu</a>
            </div>

            <div class="bg-white p-6 rounded-lg shadow-md mb-6">
                <h1 class="text-2xl font-bold text-gray-700 mb-4">Discount Codes Management</h1>
                <p class="text-sm text-gray-500 mb-6">Authenticated security fetch using native JAX-RS pipelines.</p>

                <!-- Error message dynamic container -->
                <div id="error-box" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm font-medium"></div>

                <!-- Native HTML Table styled via Tailwind -->
                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white border border-gray-200 rounded-md">
                        <thead>
                            <tr class="bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider border-b">
                                <th class="p-3">Discount Code (ID)</th>
                                <th class="p-3">Rate (%)</th>
                            </tr>
                        </thead>
                        <tbody id="discount-table-body" class="divide-y divide-gray-100 text-sm">
                            <!-- JavaScript will inject dynamic rows here -->
                            <tr>
                                <td colspan="2" class="p-4 text-center text-gray-400 italic animate-pulse">Loading secure data from TomEE...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Frontend controller substituting the old Managed Bean -->
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                // 1. Credentials payload for basic auth injection (manager:123)
                // btoa encodes characters into standard base64 string
                const authHeader = "Basic " + btoa("manager:123");

                // 2. Triggers the HTTP Fetch GET Request targeting our JAX-RS Resource
                fetch("/sampledb/api/discount-codes", {
                    method: "GET",
                    headers: {
                        "Authorization": authHeader,
                        "Accept": "application/json"
                    }
                })
                        .then(response => {
                            if (response.status === 401 || response.status === 403) {
                                throw new Error("Access Denied: Invalid credentials or role privileges.");
                            }
                            if (!response.ok) {
                                throw new Error("Server error while reading record data.");
                            }
                            return response.json(); // Parses incoming text payload into clean JS array
                        })
                        .then(data => {
                            const tbody = document.getElementById("discount-table-body");
                            tbody.innerHTML = ""; // Clears the fallback animation row

                            if (data.length === 0) {
                                tbody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-gray-400 italic">No historical records found.</td></tr>`;
                                return;
                            }

                            // 3. Loops through the dynamic array generated from our DTO/Records
                            data.forEach(item => {
                                const row = document.createElement("tr");
                                row.className = "hover:bg-gray-50 transition";
                                row.innerHTML = `
                            <td class="p-3 font-semibold text-gray-700">${item.discountCode}</td>
                            <td class="p-3 text-gray-600">${item.rate}%</td>
                        `;
                                tbody.appendChild(row);
                            });
                        })
                        .catch(error => {
                            // Catches structural exceptions and renders inside our clean HTML overlay
                            const errorBox = document.getElementById("error-box");
                            errorBox.innerText = error.message;
                            errorBox.classList.remove("hidden");

                            const tbody = document.getElementById("discount-table-body");
                            tbody.innerHTML = `<tr><td colspan="2" class="p-4 text-center text-red-500 font-medium">Failed to synchronize application layout.</td></tr>`;
                        });
            });
        </script>
    </body>
</html>
