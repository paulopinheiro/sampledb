<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SampleDB - Dashboard</title>
        <!-- Tailwind CSS via CDN for clean and fast prototyping -->
        <script src="https://tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 font-sans text-gray-800">

        <div class="min-h-screen flex flex-col">
            <!-- Top Navigation Bar -->
            <header class="bg-blue-700 text-white shadow-md p-4">
                <h1 class="text-2xl font-bold">SampleDB Enterprise Panel</h1>
            </header>

            <!-- Main Content Area -->
            <main class="flex-1 p-6 max-w-4xl mx-auto w-full">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">System Modules</h2>

                <!-- Cards Grid for Navigation -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Administrative Card -->
                    <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-red-500">
                        <h3 class="text-lg font-bold text-red-600 mb-2">Admin Management</h3>
                        <p class="text-sm text-gray-600 mb-4">Manage discount tiers, manufacturing contracts, and core configurations.</p>
                        <a href="discountCode.html" class="inline-block bg-red-500 hover:bg-red-600 text-white text-sm font-medium px-4 py-2 rounded transition shadow">
                            Discount Codes
                        </a>
                    </div>

                    <!-- Operations Card -->
                    <div class="bg-white p-5 rounded-lg shadow-md border-t-4 border-blue-500">
                        <h3 class="text-lg font-bold text-blue-600 mb-2">Operator Desk</h3>
                        <p class="text-sm text-gray-600 mb-4">Register new customers, processing incoming purchase orders, and monitor logs.</p>
                        <span class="text-xs bg-gray-200 text-gray-500 px-2 py-1 rounded">Coming Soon (REST)</span>
                    </div>
                </div>
            </main>
        </div>

    </body>
</html>
