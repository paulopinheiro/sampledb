<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SampleDB - Manufacturers</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-50 font-sans text-gray-800 p-6">

        <div class="max-w-4xl mx-auto">
            <!-- Links de Navegação -->
            <div class="mb-4">
                <a href="index.html" class="text-blue-600 hover:underline text-sm">← Back to Main Menu</a>
            </div>

            <!-- Caixas de Mensagens Dinâmicas -->
            <div id="error-box" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm font-medium border border-red-200"></div>
            <div id="success-box" class="hidden bg-green-100 text-green-700 p-3 rounded mb-4 text-sm font-medium border border-green-200"></div>

            <!-- Bloco 1: Formulário Administrativo de Fabricantes -->
            <div class="bg-white p-6 rounded-lg shadow-md mb-6 border border-gray-100">
                <h1 class="text-2xl font-bold text-gray-700 mb-2">Manufacturers Management</h1>
                <p class="text-sm text-gray-500 mb-6">Manage production partners, supply contracts, and corporate contact logs.</p>

                <h2 id="form-title" class="text-lg font-bold text-gray-700 mb-4">New Manufacturer</h2>

                <form id="manufacturer-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Manufacturer ID</label>
                        <!-- O Label visual que o usuário enxerga -->
                        <div id="manufacturerIdLabel" class="w-full p-2 bg-gray-100 border border-gray-300 rounded font-bold text-gray-500 bg-gray-100 select-none">
                            Auto-generated
                        </div>
                        <!--  <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Manufacturer ID</label>
                        <input type="number" id="manufacturerId" required min="1"
                                class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold"> -->
                        <input type="hidden" id="manufacturerId" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Company Name</label>
                        <input type="text" id="name" required maxlength="30"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Address Line 1</label>
                        <input type="text" id="addressLine1" required maxlength="30"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Address Line 2</label>
                        <input type="text" id="addressLine2" maxlength="30"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">City</label>
                        <input type="text" id="city" required maxlength="25"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">State (Code)</label>
                        <input type="text" id="state" required maxlength="2" placeholder="EX"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Phone</label>
                        <input type="text" id="phone" maxlength="12"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Fax</label>
                        <input type="text" id="fax" maxlength="12"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Email</label>
                        <input type="email" id="email" maxlength="40"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Rep Contact</label>
                        <input type="text" id="rep" maxlength="30"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <!-- Botões de Ação -->
                    <div class="md:col-span-2 flex flex-wrap gap-2 pt-4 justify-between border-t border-gray-100 mt-2">
                        <div class="flex gap-2">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded text-sm shadow transition">
                                Save Manufacturer
                            </button>
                            <button type="button" id="btn-clear" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded text-sm transition">
                                Clear Form
                            </button>
                        </div>
                        <button type="button" id="btn-delete" class="hidden bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded text-sm shadow transition">
                            Remove Manufacturer
                        </button>
                    </div>
                </form>
            </div>

            <!-- Bloco 2: Tabela de Listagem -->
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                <h2 class="text-xl font-bold text-gray-700 mb-4">Registered Manufacturers</h2>

                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white border border-gray-200 rounded-md">
                        <thead>
                            <tr class="bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider border-b">
                                <th class="p-3">ID</th>
                                <th class="p-3">Name</th>
                                <th class="p-3">Location</th>
                                <th class="p-3">Contact Email</th>
                            </tr>
                        </thead>
                        <tbody id="manufacturer-table-body" class="divide-y divide-gray-100 text-sm">
                            <tr>
                                <td colspan="4" class="p-4 text-center text-gray-400 italic animate-pulse">Loading manufacturing records...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script>
            const API_URL = "/sampledb/api/manufacturers";
            const AUTH_HEADER = "Basic " + btoa("manager:123");
            let isEditMode = false;
            document.addEventListener("DOMContentLoaded", () => {
            loadTableData();
            document.getElementById("manufacturer-form").addEventListener("submit", handleSave);
            document.getElementById("btn-clear").addEventListener("click", clearForm);
            document.getElementById("btn-delete").addEventListener("click", handleDelete);
            });
            // FETCH GET: Carrega todos os fabricantes e popula a tabela
            // FETCH GET: Carrega todos os fabricantes e popula a tabela de forma 100% segura
            function loadTableData() {
            fetch(API_URL, {
            method: "GET",
                    headers: { "Authorization": AUTH_HEADER, "Accept": "application/json" }
            })
                    .then(res => {
                    if (res.status === 401 || res.status === 403) throw new Error("Acesso negado: Verifique suas credenciais.");
                    if (!res.ok) throw new Error("Erro no servidor ao ler registros de fabricantes.");
                    return res.json();
                    })
                    .then(data => {
                    const tbody = document.getElementById("manufacturer-table-body");
                    tbody.innerHTML = "";
                    if (data.length === 0) {
                            tbody.innerHTML = ` < tr > <td colspan="4" class="p-4 text-center text-gray-400 italic">Nenhum fab r icante cadastrado.</td> < /tr>`;
                    return;
                    }

                    data.forEach(item => {                     const row = document.createElement("tr");
                    row.className = "hover:bg-gray-50 transition";
                    const city = item.city ? item.city.trim() : "";
                    const state = item.state ? item.state.trim() : "";
                    const location = (city && state) ? `${city}/${state}` : (city || state || "Não informado");
                    const email = item.email ? item.email.trim() : "N/A";
                    // 1. Criamos a tag do link isolada na memória do JavaScript
                    const link = document.createElement("a");
                    link.href = "#";
                    link.className = "text-blue-600 hover:text-blue-800 font-bold hover:underline";
                    link.innerText = item.manufacturerId;
                    // 2. Amarrarmos o evento de clique DIRETAMENTE no objeto, passando a referência viva do 'item'
                    link.addEventListener("click", (event) => {
                    event.preventDefault();
                    selectRecord(item); // Sem aspas, sem stringify, 100% Type-Safe!
                    });
                    // 3. Montamos a estrutura das colunas de texto da linha
                    row.innerHTML = `
                        <td class="p-3"></td> <!-- A primeira coluna nascerá vazia para receber o link -->
                        <td class="p-3 font-medium text-gray-700">${item.name}</td>
                        <td class="p-3 text-gray-600">${location}</td>
                        <td class="p-3 text-gray-500">${email}</td>
                    `;
                    // 4. Injetamos o link seguro criado na memória direto na primeira célula (td) da linha
                    row.querySelector("td").appendChild(link);
                    tbody.appendChild(row);
                    });
                    })
                            .catch(err => showMessage("error-box", err.message));
                    }

                    // Ação: Ao clicar no link do ID, preenche o formulário inteiro para edição
                    function selectRecord(item) {
                    // Atualiza o input oculto e o label visual
                    document.getElementById("manufacturerId").value = item.manufacturerId;
                    document.getElementById("manufacturerIdLabel").innerText = item.manufacturerId;
                    document.getElementById("manufacturerIdLabel").classList.remove("text-gray-500");
                    document.getElementById("manufacturerIdLabel").classList.add("text-gray-800");
                    document.getElementById("name").value = item.name || "";
                    document.getElementById("addressLine1").value = item.addressLine1 || "";
                    document.getElementById("addressLine2").value = item.addressLine2 || "";
                    document.getElementById("city").value = item.city || "";
                    document.getElementById("state").value = item.state || "";
                    document.getElementById("phone").value = item.phone || "";
                    document.getElementById("fax").value = item.fax || "";
                    document.getElementById("email").value = item.email || "";
                    document.getElementById("rep").value = item.rep || "";
                    document.getElementById("form-title").innerText = "Update Manufacturer: " + item.name;
                    document.getElementById("btn-delete").classList.remove("hidden");
                    isEditMode = true;
                    hideMessages();
                    }

                    // FETCH POST: Envia o payload completo do Record DTO para salvar ou atualizar
                    function handleSave(event) {
                    event.preventDefault();
                    hideMessages();
                    const idValue = document.getElementById("manufacturerId").value;
                    const payload = {
                    // Se estiver vazio (Novo), envia null para o TomEE gerar automaticamente. Se for edição, envia o ID numérico.
                    manufacturerId: idValue ? parseInt(idValue) : null,
                            name: document.getElementById("name").value.trim(),
                            addressLine1: document.getElementById("addressLine1").value.trim() || null,
                            addressLine2: document.getElementById("addressLine2").value.trim() || null,
                            city: document.getElementById("city").value.trim() || null,
                            state: document.getElementById("state").value.toUpperCase().trim() || null,
                            phone: document.getElementById("phone").value.trim() || null,
                            fax: document.getElementById("fax").value.trim() || null,
                            email: document.getElementById("email").value.trim() || null,
                            rep: document.getElementById("rep").value.trim() || null
                    };
                    fetch(API_URL, {
                    method: "POST",
                            headers: {
                            "Authorization": AUTH_HEADER,
                                    "Content-Type": "application/json"
                            },
                  body: JSON.stringify(payload)
                })
                        .then(res => {
                            if (!res.ok)
                                return res.text().then(textErr => { 
                        throw new Error(textErr || "Erro ao processar os dados cadastrais no servidor."); 
                    });
                            showMessage("success-box", isEditMode ? "Fabricante atualizado com sucesso!" : "Novo fabricante cadastrado com sucesso!");
                            clearForm();
                            loadTableData();
                        })
                        .catch(err => showMessage("error-box", err.message));
            }

            // FETCH DELETE: Remove o fabricante pelo ID
            function handleDelete() {
                const id = document.getElementById("manufacturerId").value;
                const name = document.getElementById("name").value;
                if (!id || !confirm(`Tem certeza que deseja excluir permanentemente o fabricante "${name}"?`))
                    return;

                hideMessages();

                fetch(`${API_URL}/${id}`, {
                    method: "DELETE",
                    headers: {"Authorization": AUTH_HEADER}
                })
                        .then(res => {
                            if (!res.ok)
                                throw new Error("Não foi possível remover. O fabricante pode estar vinculado a produtos ativos.");
                            showMessage("success-box", "Fabricante removido com sucesso do catálogo do sistema.");
                            clearForm();
                            loadTableData();
                        })
                        .catch(err => showMessage("error-box", err.message));
            }

            // Utilitários de Reset e Mensagens
            function clearForm() {
            document.getElementById("manufacturer-form").reset();
            
            // Reseta o controle do ID
            document.getElementById("manufacturerId").value = "";
            document.getElementById("manufacturerIdLabel").innerText = "Auto-generated";
            document.getElementById("manufacturerIdLabel").classList.remove("text-gray-800");
            document.getElementById("manufacturerIdLabel").classList.add("text-gray-500");

            document.getElementById("form-title").innerText = "New Manufacturer";
            document.getElementById("btn-delete").classList.add("hidden");
            isEditMode = false;
        }

            function showMessage(elementId, text) {
                const box = document.getElementById(elementId);
                box.innerText = text;
                box.classList.remove("hidden");
                setTimeout(() => box.classList.add("hidden"), 5000);
            }

            function hideMessages() {
                document.getElementById("error-box").classList.add("hidden");
                document.getElementById("success-box").classList.add("hidden");
            }
        </script>

    </body>
</html>
