<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SampleDB - Products</title>
        <!-- Tag padrão e definitiva do Tailwind CSS homologada no laboratório -->
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-50 font-sans text-gray-800 p-6">

        <div class="max-w-5xl mx-auto">
            <!-- Links de Navegação -->
            <div class="mb-4">
                <a href="index.html" class="text-blue-600 hover:underline text-sm">← Back to Main Menu</a>
            </div>

            <!-- Caixas de Mensagens Dinâmicas (Tratamento Nativo de Validação) -->
            <div id="error-box" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm font-medium border border-red-200"></div>
            <div id="success-box" class="hidden bg-green-100 text-green-700 p-3 rounded mb-4 text-sm font-medium border border-green-200"></div>

            <!-- Bloco 1: Formulário Administrativo de Produtos -->
            <div class="bg-white p-6 rounded-lg shadow-md mb-6 border border-gray-100">
                <h1 class="text-2xl font-bold text-gray-700 mb-2">Products Catalog</h1>
                <p class="text-sm text-gray-500 mb-6">Manage merchandise specifications, synchronized pricing tables, and automated buffer stocks.</p>

                <h2 id="form-title" class="text-lg font-bold text-gray-700 mb-4">New Product</h2>

                <form id="product-form" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Campo ID (Seguindo a lógica de label/hidden do auto-incremento se aplicável) -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Product ID</label>
                        <input type="number" id="productId" required min="1"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold">
                    </div>

                    <!-- Combo-Box Relacional 1: Código do Produto (Chave Estrangeira) -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Product Code (FK)</label>
                        <select id="prodCode" required 
                                class="w-full p-2 border border-gray-300 rounded bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium">
                            <option value="">Loading codes...</option>
                        </select>
                    </div>

                    <!-- Combo-Box Relacional 2: Fabricante (Chave Estrangeira) -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Manufacturer (FK)</label>
                        <select id="manufacturerId" required 
                                class="w-full p-2 border border-gray-300 rounded bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium">
                            <option value="">Loading manufacturers...</option>
                        </select>
                    </div>

                    <!-- Campos de Texto e Métricas de Negócio -->
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Description</label>
                        <input type="text" id="description" required maxlength="50"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Available to Sell</label>
                        <select id="available" required 
                                class="w-full p-2 border border-gray-300 rounded bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none font-medium">
                            <option value="TRUE">Yes (TRUE)</option>
                            <option value="FALSE">No (FALSE)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Purchase Cost ($)</label>
                        <input type="number" id="purchaseCost" required step="0.01" min="0"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">QuantityOnHand (Buffer)</label>
                        <input type="number" id="quantityOnHand" required min="0"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Markup (%)</label>
                        <input type="number" id="markup" required step="0.01" min="0"
                               class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>

                    <!-- Painel Unificado de Botões de Ação -->
                    <div class="md:col-span-3 flex flex-wrap gap-2 pt-4 justify-between border-t border-gray-100 mt-2">
                        <div class="flex gap-2">
                            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded text-sm shadow transition">
                                Save Product
                            </button>
                            <button type="button" id="btn-clear" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium px-4 py-2 rounded text-sm transition">
                                Clear Form
                            </button>
                        </div>
                        <button type="button" id="btn-delete" class="hidden bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded text-sm shadow transition">
                            Remove Product
                        </button>
                    </div>
                </form>
            </div>

            <!-- Bloco 2: Tabela de Inventário Geral -->
            <div class="bg-white p-6 rounded-lg shadow-md border border-gray-100">
                <h2 class="text-xl font-bold text-gray-700 mb-4">Stock Inventory Table</h2>

                <div class="overflow-x-auto">
                    <table class="min-w-full bg-white border border-gray-200 rounded-md">
                        <thead>
                            <tr class="bg-gray-100 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider border-b">
                                <th class="p-3">ID</th>
                                <th class="p-3">Code</th>
                                <th class="p-3">Description</th>
                                <th class="p-3">Manufacturer</th>
                                <th class="p-3 text-right">Cost</th>
                                <th class="p-3 text-right">Stock</th>
                                <th class="p-3 text-center">Active</th>
                            </tr>
                        </thead>
                        <tbody id="product-table-body" class="divide-y divide-gray-100 text-sm">
                            <tr>
                                <td colspan="7" class="p-4 text-center text-gray-400 italic animate-pulse">Loading relational stock metrics...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script src="resources/js/product.js"></script>
    </body>
</html>
